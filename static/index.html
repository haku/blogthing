<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blogthing</title>
    <link rel="stylesheet" href="/editor.css">
    <style>
      #thinglist menu {
        list-style-type: none;
        margin: 0;
        padding: 0;
      }
      #thinglist .thing {
        margin: 0.5em;
        padding: 0.5em;
      }
      #thinglist .thing a {
        display: block;
        text-decoration: none;
      }
      #thinglist .thing h3 {
        margin: 0.2em 0;
      }
      #thinglist .thing p {
        margin: 0.2em 0;
      }
      #thinglist .thing.published {
        border-left: 5px solid light-dark(#009a4a, #81ffbe);
        padding-left: 0.5em;
      }
    </style>
  </head>
  <body>
    <div class="main-container">
      <div id="toolbox" class="toolbox tool-style">
        <div class="toolbar">
          <div class="bar left">
            <button id="new_thing">New Thing</button>
          </div>
          <div id="taglist" class="bar center">
            <template id="tagtemplate"><button></button></template>
          </div>
          <div class="bar right">
            <a href="/media.html">Media</a>
          </div>
        </div>
      </div>

      <div class="main-content">
        <div id="thinglist">
          <menu>
          </menu>
        </div>
        <template id="thingtemplate">
          <li class="thing">
            <a>
              <h3></h3>
              <p class="tags"></p>
              <p class="date"></p>
            </a>
          </li>
        </template>
      </div>
    </div>


    <script type="module">
      import * as Misc from './misc.mjs'

      const newBtn = document.getElementById('new_thing')
      const tagList = document.getElementById('taglist')
      const thingList = document.querySelector('#thinglist menu')
      let filter_tags = []  // TODO store this in the page url

      function loadTags() {
        fetch('/tags/top')
        .then(async response => {
          await Misc.checkFetchResp(response)
          return response.json();
        })
        .then(data => {
          const tmpl = document.getElementById('tagtemplate')
          for (const tag of data) {
            const row = tmpl.content.cloneNode(true)
            const btn = row.querySelector("button")
            btn.textContent = `${tag.title}(${tag.count})`
            btn.addEventListener('click', () => {
              if (filter_tags.includes(tag.title)) {
                filter_tags = filter_tags.filter(t => t !== tag.title)
                btn.classList.remove('is-active')
              }
              else {
                filter_tags.push(tag.title)
                btn.classList.add('is-active')
              }
              loadThings()
            })
            tagList.append(row)
          }
        })
      }

      function loadThings() {
        let url = "/things"
        if (filter_tags.length > 0) {
          const params = new URLSearchParams();
          for (const tag of filter_tags) {
            params.append("t", tag);
          }
          url += `?${params}`
        }

        fetch(url)
        .then(async response => {
          await Misc.checkFetchResp(response)
          return response.json();
        })
        .then(data => {
          thingList.innerHTML = ""
          const row_template = document.querySelector('#thingtemplate')
          for (const t of data) {
            const row = row_template.content.cloneNode(true)
            row.querySelector("a").setAttribute("href", `/editor.html?thing_id=${t.id}`)
            row.querySelector("h3").textContent = t.title || "Untitled"
            row.querySelector(".tags").textContent = t.tags.join(", ")
            row.querySelector(".date").textContent =
                `${Misc.formatTimestamp(t.updated)} • v${t.version}`
            row.firstElementChild.classList.add(t.published ? "published" : "pnpublished")
            thingList.append(row)
          }
        })
      }

      function newThing() {
        return fetch('/things', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({"action": "new"}),
        })
        .then(response => {
          if (!response.ok) throw new Error(`HTTP error ${response.status}`);
          return response.json();
        })
        .then(data => {
          const thing_id = data['thing_id'];
          location.assign(`/editor.html?thing_id=${thing_id}`)
        })
        .catch(error => {
          console.error('Error making new thing:', error)
        })
      }

      newBtn.addEventListener('click', newThing)
      loadThings()
      loadTags()
    </script>
  </body>
</html>
