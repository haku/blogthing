<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blogthing</title>
    <style>
      #thinglist .thing a {
        display: block;
      }
      #thinglist .thing h3 {
        margin: 0.2em 0;
      }
      #thinglist .thing p {
        margin: 0.2em 0;
      }
    </style>
  </head>
  <body>
    <div>
      <button id="new_thing">New Thing</button>
    </div>
    <div id="thinglist">
      <ul>
      </ul>
    </div>
    <template id="thingtemplate">
      <li class="thing">
        <a>
          <h3></h3>
          <p></p>
        </a>
      </li>
    </template>

    <script type="module">
      const newBtn = document.getElementById('new_thing')
      const thingList = document.querySelector('#thinglist ul')

      function formatTimestamp(timestamp) {
        const d = new Date(timestamp * 1000);
        const pad = n => String(n).padStart(2, "0");
        return `${d.getFullYear()}-${
            pad(d.getMonth() + 1)}-${
            pad(d.getDate())} ${
            pad(d.getHours())}:${
            pad(d.getMinutes())}:${
            pad(d.getSeconds())}`;
      }

      function loadThings() {
        const row_template = document.querySelector('#thingtemplate')

        fetch('/things')
        .then(response => {
          if (!response.ok) throw new Error(`HTTP error ${response.status}`);
          return response.json();
        })
        .then(data => {
          for (const t of data) {
            const row = row_template.content.cloneNode(true)
            row.querySelector("a").setAttribute("href", `/editor.html?thing_id=${t.id}`)
            row.querySelector("h3").textContent = t.title || "Untitled"
            row.querySelector("p").textContent = `${t.id}: v${t.version} ${formatTimestamp(t.updated)}`
            thingList.append(row)
          }
        })
      }

      function newThing() {
        return fetch('/things', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({"action": "new"}),
        })
        .then(response => {
          if (!response.ok) throw new Error(`HTTP error ${response.status}`);
          return response.json();
        })
        .then(data => {
          const thing_id = data['thing_id'];
          navigation.navigate(`/editor.html?thing_id=${thing_id}`)
        })
        .catch(error => {
          console.error('Error making new thing:', error)
        })
      }

      newBtn.addEventListener('click', newThing)
      loadThings()
    </script>
  </body>
</html>
