<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blogthing</title>
    <link rel="stylesheet" href="/editor.css">
    <link rel="stylesheet" href="/editor-dark.css">
    <style>
      #thinglist ul {
        list-style-type: none;
        margin: 0;
        padding: 0;
      }
      #thinglist .thing {
        margin: 0.5em;
        padding: 0.5em;
        border-radius: 0.25rem;
      }
      #thinglist .thing a {
        display: block;
        text-decoration: none;
      }
      #thinglist .thing h3 {
        margin: 0.2em 0;
      }
      #thinglist .thing p {
        margin: 0.2em 0;
        font-size: .8rem;
      }
    </style>
  </head>
  <body>
    <div class="main-container">
      <div id="toolbox" class="toolbox">
        <div class="toolbar">
          <div class="bar left">
          </div>
          <div class="bar center">
            <button id="new_thing">New Thing</button>
            <a href="/media.html">Media</a>
          </div>
          <div class="bar right">
          </div>
        </div>
      </div>

      <div class="main-content">
        <div id="thinglist">
          <ul>
          </ul>
        </div>
        <template id="thingtemplate">
          <li class="thing">
            <a>
              <h3></h3>
              <p></p>
            </a>
          </li>
        </template>
      </div>
    </div>


    <script type="module">
      import * as Misc from './misc.mjs'

      const newBtn = document.getElementById('new_thing')
      const thingList = document.querySelector('#thinglist ul')

      function loadThings() {
        const row_template = document.querySelector('#thingtemplate')

        fetch('/things')
        .then(async response => {
          await Misc.checkFetchResp(response)
          return response.json();
        })
        .then(data => {
          for (const t of data) {
            const row = row_template.content.cloneNode(true)
            row.querySelector("a").setAttribute("href", `/editor.html?thing_id=${t.id}`)
            row.querySelector("h3").textContent = t.title || "Untitled"
            row.querySelector("p").textContent =
                `${Misc.formatTimestamp(t.updated)} • v${t.version}`
            row.firstElementChild.classList.add(t.published ? "published" : "pnpublished")
            thingList.append(row)
          }
        })
      }

      function newThing() {
        return fetch('/things', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({"action": "new"}),
        })
        .then(response => {
          if (!response.ok) throw new Error(`HTTP error ${response.status}`);
          return response.json();
        })
        .then(data => {
          const thing_id = data['thing_id'];
          location.assign(`/editor.html?thing_id=${thing_id}`)
        })
        .catch(error => {
          console.error('Error making new thing:', error)
        })
      }

      newBtn.addEventListener('click', newThing)
      loadThings()
    </script>
  </body>
</html>
