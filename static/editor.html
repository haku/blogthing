<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <title>Blogthing</title>
    <link rel="stylesheet" href="/editor.css">
  </head>
  <body>
    <div class="editor-container">
      <div class="toolbar" id="toolbar">
        <div class="bar">
          <button id="home" style="font-weight: bold; width: 3em;">⌂</button>

          <span style="flex-grow: 1;"></span>

          <button id="metadata">📤</button>
          <button id="versions">
            <span id="version"></span>
            <span id="status"></span>
          </button>
        </div>
        <div id="metadata-bar" class="bar subbar bar-hide">
          <div>
            <label for="thing_date">Date:</label>
            <input type="text" id="thing_date" name="thing_date"
              pattern="[0-9]{4}-[0-9]{2}-[0-9]{2}" />
          </div>
          <button id="thing_published">Unpublished</button>
        </div>
        <div class="bar">
          <button data-tiptap-button="bold">B</button>
          <button data-tiptap-button="italic">I</button>
          <button data-tiptap-button="strike">S</button>
          <button data-tiptap-button="code">C</button>
          <button data-tiptap-button="h1">H1</button>
          <button data-tiptap-button="h2">H2</button>
          <button data-tiptap-button="bulletList">•</button>
          <button data-tiptap-button="orderedList">1</button>
          <button data-tiptap-button="blockquote">&gt;"</button>
          <button data-tiptap-button="codeBlock">&gt;C</button>
          <button data-tiptap-button="link">🔗</button>
          <button data-tiptap-button="unlink">⛓️‍💥</button>
        </div>
      </div>
      <div class="msgpop-wrapper">
        <div id="pop-msg"  class="msgpop"></div>
        <div id="pop-info" class="msgpop"></div>
      </div>
      <div id="editor"></div>
    </div>

    <script type="module">
      import * as EditorIO from './editor-io.mjs'

      const homeBtn = document.getElementById('home');
      homeBtn.addEventListener('click', () => location.assign("/"))

      const mdBtn = document.getElementById('metadata');
      const mdBar = document.getElementById('metadata-bar');
      mdBtn.addEventListener('click', () => {
        if (mdBar.classList.contains('bar-hide')) {
          mdBar.classList.remove('bar-hide')
          mdBtn.classList.add('is-active')
        }
        else {
          mdBar.classList.add('bar-hide')
          mdBtn.classList.remove('is-active')
        }
      })

      const versionsBtn = document.getElementById('versions');
      // TODO if not saved, first click saves.  second click goes to versions.
      versionsBtn.addEventListener('click', () => {
        const path = EditorIO.LOAD_VERSION
          ? `/editor.html?thing_id=${EditorIO.THING_ID}`
          : `/versions.html?thing_id=${EditorIO.THING_ID}`
        location.assign(path)
      })

      EditorIO.start()
    </script>
  </body>
</html>
