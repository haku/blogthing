<!doctype html>
<!-- https://tiptap.dev/docs/editor/getting-started/install/vanilla-javascript#without-a-build-tool-cdn -->
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blogthing</title>
    <style>
      body {
        margin: 2rem;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      input:invalid {
        background-color: red;
      }
      .editor-container {
        max-width: 48rem;
        margin: 0 auto;
      }
      .toolbar {
        display: flex;
        gap: 0.25rem;
        padding: 0.5rem;
        border: 1px solid #d1d5db;
        border-bottom: none;
        border-radius: 0.375rem 0.375rem 0 0;
        background: #f9fafb;
        flex-wrap: wrap;
      }
      .toolbar button {
        padding: 0.25rem 0.5rem;
        font-size: 0.875rem;
        border: 1px solid transparent;
        border-radius: 0.25rem;
        background: transparent;
        cursor: pointer;
      }
      .toolbar button:hover {
        background: #e5e7eb;
      }
      .toolbar button.is-active {
        background: #111827;
        color: #fff;
      }
      .tiptap {
        padding: 0.75rem 1rem;
        border: 1px solid #d1d5db;
        border-radius: 0 0 0.375rem 0.375rem;
        min-height: 10rem;
        outline: none;
      }
      .tiptap p { margin: 0.5rem 0; }
      .tiptap h1, .tiptap h2, .tiptap h3 { margin: 1rem 0 0.5rem; }
      .tiptap ul, .tiptap ol { padding-left: 1.5rem; }
      .tiptap pre {
        background: #111827;
        color: #f3f4f6;
        padding: 0.75rem;
        border-radius: 0.25rem;
        font-size: 0.875rem;
      }
      .tiptap code {
        background: #f3f4f6;
        padding: 0.125rem 0.25rem;
        border-radius: 0.25rem;
        font-size: 0.875rem;
      }
      .tiptap pre code {
        background: transparent;
        padding: 0;
      }

      .tiptap [data-resize-container] {
        line-height: 0;
      }
      .tiptap .ProseMirror-selectednode [data-resize-wrapper] {
        outline: 1px solid rgba(0, 0, 0, 0.5);
      }
      .tiptap [data-resize-handle] {
        visibility: hidden;
        position: absolute;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 5px;
        z-index: 10;
        width: 8px;
        height: 8px;
      }
      .tiptap .ProseMirror-selectednode [data-resize-handle] {
        visibility: visible;
      }
    </style>
  </head>
  <body>
    <div>
      <a id="latest_link" href="" style="display: none;">Latest</a>
      <a id="versions_link" href="">Versions</a>
    </div>
    <div id="message">...</div>
    <div id="status">...</div>
    <div id="info">...</div>
    <div id="metadata">
      <label for="thing_date">Date:</label>
      <input type="text" id="thing_date" name="thing_date"
        pattern="[0-9]{4}-[0-9]{2}-[0-9]{2}" />
    </div>
    <div class="editor-container">
      <div class="toolbar" id="toolbar">
        <button data-tiptap-button="bold">Bold</button>
        <button data-tiptap-button="italic">Italic</button>
        <button data-tiptap-button="strike">Strike</button>
        <button data-tiptap-button="code">Code</button>
        <button data-tiptap-button="h1">H1</button>
        <button data-tiptap-button="h2">H2</button>
        <button data-tiptap-button="bulletList">Bullet List</button>
        <button data-tiptap-button="orderedList">Ordered List</button>
        <button data-tiptap-button="blockquote">Blockquote</button>
        <button data-tiptap-button="codeBlock">Code Block</button>
        <button data-tiptap-button="link">Link</button>
        <button data-tiptap-button="unlink">Unlink</button>
      </div>
      <div id="editor"></div>
    </div>

    <script type="module">
      import * as EditorIO from './editor-io.mjs'

      const latestLink = document.getElementById('latest_link');
      const versionsLink = document.getElementById('versions_link');

      if (EditorIO.LOAD_VERSION != null) {
        latestLink.setAttribute("href", `/editor.html?thing_id=${EditorIO.THING_ID}`)
        latestLink.style.display = "initial"
      }
      versionsLink.setAttribute("href", `/versions.html?thing_id=${EditorIO.THING_ID}`)

      EditorIO.start()
    </script>
  </body>
</html>
