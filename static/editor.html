<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <title>Blogthing</title>
    <link rel="stylesheet" href="/editor.css">
  </head>
  <body>
    <div class="main-container">
      <div id="heading-popover-menu" class="popover-menu tool-style" popover="auto">
        <button data-tiptap-button="h1">H1</button>
        <button data-tiptap-button="h2">H2</button>
      </div>
      <div id="list-popover-menu" class="popover-menu tool-style" popover="auto">
        <button data-tiptap-button="bulletList">•</button>
        <button data-tiptap-button="orderedList">1</button>
      </div>
      <div id="block-popover-menu" class="popover-menu tool-style" popover="auto">
        <button data-tiptap-button="blockquote">&gt;"</button>
        <button data-tiptap-button="codeblock">&gt;C</button>
      </div>

      <div id="toolbox" class="toolbox tool-style">
        <div class="toolbar">
          <div class="bar left">
            <button id="home" style="font-weight: bold; width: 3em;">⌂</button>
          </div>

          <div class="bar center">
            <button data-tiptap-button="bold">B</button>
            <button data-tiptap-button="italic">I</button>
            <button data-tiptap-button="strike">S</button>
            <button data-tiptap-button="code">C</button>

            <button data-tiptap-button="heading"
              class="popover-button"
              popovertarget="heading-popover-menu">H</button>
            <button data-tiptap-button="h1">H1</button>
            <button data-tiptap-button="h2">H2</button>

            <button data-tiptap-button="list"
              class="popover-button"
              popovertarget="list-popover-menu">L</button>
            <button data-tiptap-button="bulletList">•</button>
            <button data-tiptap-button="orderedList">1</button>

            <button data-tiptap-button="block"
              class="popover-button"
              popovertarget="block-popover-menu">&gt;</button>
            <button data-tiptap-button="blockquote">&gt;"</button>
            <button data-tiptap-button="codeblock">&gt;C</button>

            <button data-tiptap-button="link">🔗</button>
          </div>

          <div class="bar right">
            <button id="settings">⚙️</button>
            <button id="versions">
              <span id="version"></span>
              <span id="state"></span>
            </button>
          </div>
        </div>
      </div>

      <div class="msgpop-wrapper">
        <div id="pop-msg"  class="msgpop"></div>
      </div>

      <div id="settingsbox" class="tool-style hidden">
        <div class="group">
          <span>Tags:</span> <span id="thing_tags"></span>
          <template id="tagtemplate"><button></button></template>
          <button id="addtag">Add Tag</button>
        </div>
        <div class="group">
          <label for="thing_date">Date:</label>
          <input type="text" id="thing_date" name="thing_date"
            pattern="[0-9]{4}-[0-9]{2}-[0-9]{2}" />
        </div>
        <div class="group">
          <button id="delete">🗑️ Delete</button>
          <button id="thing_published">Unpublished</button>
        </div>
      </div>

      <div id="link-bubble-menu" class="bubble-menu" style="visibility: hidden;">
        <div class="preview"></div>
        <div class="buttons">
          <button class="edit">edit</button>
          <button class="unlink">unlink</button>
          <a target="_blank">visit</a>
        </div>
      </div>
      <div id="list-bubble-menu" class="bubble-menu" style="visibility: hidden;">
        <button class="lift">&lt;</button>
        <button class="sink">&gt;</button>
      </div>

      <div id="editor"></div>
      <div style="height: 50vh;"></div>
    </div>

    <script type="module">
      import * as EditorIO from './editor-io.mjs'

      const homeBtn = document.getElementById('home');
      homeBtn.addEventListener('click', async () => {
        await EditorIO.saveIfNeeded()
        location.assign("/")
      })

      const setsBox = document.getElementById('settingsbox');
      const setsBtn = document.getElementById('settings');
      setsBtn.addEventListener('click', () => {
        if (setsBox.classList.contains('hidden')) {
          setsBox.classList.remove('hidden')
          setsBtn.classList.add('is-active')
          window.scrollTo(0, 0)
        }
        else {
          setsBox.classList.add('hidden')
          setsBtn.classList.remove('is-active')
        }
      })

      const versionsBtn = document.getElementById('versions');
      versionsBtn.addEventListener('click', async () => {
        if (await EditorIO.saveIfNeeded()) return

        const path = EditorIO.LOAD_VERSION
          ? `/editor.html?thing_id=${EditorIO.THING_ID}`
          : `/versions.html?thing_id=${EditorIO.THING_ID}`
        location.assign(path)
      })

      EditorIO.start()
    </script>
  </body>
</html>
