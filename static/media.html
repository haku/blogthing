<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blogthing</title>
    <style>
      #medialist .media p {
        margin: 0.2em 0;
      }
      #medialist .media img {
        max-width: 20em;
        max-height: 10em;
      }
    </style>
  </head>
  <body>
    <div id="medialist">
      <ul>
      </ul>
    </div>
    <template id="mediatemplate">
      <li class="media">
        <p></p>
        <img></img>
      </li>
    </template>

    <script type="module">
      import * as Misc from './misc.mjs'

      const mediaList = document.querySelector('#medialist ul')

      function loadMedia() {
        const row_template = document.querySelector('#mediatemplate')

        fetch('/imgs')
        .then(async response => {
          await Misc.checkFetchResp(response)
          return response.json();
        })
        .then(data => {
          for (const t of data) {
            const row = row_template.content.cloneNode(true)
            row.querySelector("p").textContent = `${t.size} bytes ${Misc.formatTimestamp(t.created)}`
            row.querySelector("img").setAttribute("src", `/imgs/${t.id}.${t.extension}`)
            mediaList.append(row)
          }
        })
      }

      loadMedia()
    </script>
  </body>
</html>
