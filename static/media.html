<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blogthing</title>
    <style>
      #medialist .media p {
        margin: 0.2em 0;
      }
      #medialist .media img {
        max-width: 20em;
        max-height: 10em;
      }
    </style>
  </head>
  <body>
    <div id="medialist">
      <ul>
      </ul>
    </div>
    <template id="mediatemplate">
      <li class="media">
        <p></p>
        <img></img>
      </li>
    </template>

    <script type="module">
      const mediaList = document.querySelector('#medialist ul')

      # TODO move to module and dedupe
      function formatTimestamp(timestamp) {
        const d = new Date(timestamp * 1000);
        const pad = n => String(n).padStart(2, "0");
        return `${d.getFullYear()}-${
            pad(d.getMonth() + 1)}-${
            pad(d.getDate())} ${
            pad(d.getHours())}:${
            pad(d.getMinutes())}:${
            pad(d.getSeconds())}`;
      }

      function loadMedia() {
        const row_template = document.querySelector('#mediatemplate')

        fetch('/imgs')
        .then(response => {
          if (!response.ok) throw new Error(`HTTP error ${response.status}`);
          return response.json();
        })
        .then(data => {
          for (const t of data) {
            const row = row_template.content.cloneNode(true)
            row.querySelector("p").textContent = `${t.size} bytes ${formatTimestamp(t.created)}`
            row.querySelector("img").setAttribute("src", `/imgs/${t.id}.${t.extension}`)
            mediaList.append(row)
          }
        })
      }

      loadMedia()
    </script>
  </body>
</html>
